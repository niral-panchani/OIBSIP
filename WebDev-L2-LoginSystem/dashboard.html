<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SecureAccess</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="dashboard-card">
        <div class="brand">SecureAccess</div>
        <div class="dashboard-icon">✓</div>
        <h1>Welcome to your dashboard!</h1>
        <p class="subtitle">You have successfully logged in.</p>

        <section class="profile-box">
            <p>Logged in as</p>
            <h2 id="welcomeName">User</h2>
            <p id="welcomeEmail"></p>
        </section>

        <p class="success-message">Your demo session is active.</p>

        <button type="button" id="logoutButton" class="logout-btn">
            Logout
        </button>
    </main>
</body>

</html>
