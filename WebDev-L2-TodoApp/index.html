<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">
        <header class="app-header">
            <p class="eyebrow">PLAN YOUR DAY</p>
            <h1>My To-Do List</h1>
            <p class="subtitle">Small steps make a big difference.</p>
        </header>

        <form id="taskForm" class="task-form">
            <input type="text" id="taskInput" placeholder="What do you need to do?" maxlength="200" autocomplete="off"
                required>
            <button type="submit" class="add-btn">+ Add Task</button>
        </form>

        <p id="message" class="message" aria-live="polite"></p>

        <section class="task-section">
            <div class="section-heading">
                <h2>Pending Tasks</h2>
                <span id="pendingCount" class="count">0 pending</span>
            </div>
            <ul id="pendingList" class="task-list"></ul>
            <p id="pendingEmpty" class="empty-state">
                You're all caught up! Add a task to get started.
            </p>
        </section>

        <section class="task-section completed-section">
            <div class="section-heading">
                <h2>Completed Tasks</h2>
                <span id="completedCount" class="count">0 completed</span>
            </div>
            <ul id="completedList" class="task-list"></ul>
            <p id="completedEmpty" class="empty-state">
                Completed tasks will appear here.
            </p>
        </section>

        <footer>
            Your tasks are saved in this browser.
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
